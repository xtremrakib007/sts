<!-- ══ ATTENDANCE ══ -->
      <div id="pageAttendance" class="page">
        <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
          <div><div style="font-family:'Syne',sans-serif;font-size:19px;font-weight:700">⏰ Attendance</div>
            <div style="font-size:11px;color:var(--tx3)">Daily check-in and check-out with selfie verification</div></div>
        </div>
        <div class="att-clock-wrap">
          <div class="att-time-big" id="attClk">00:00:00</div>
          <div class="att-date-str" id="attDateStr">—</div>
          <div id="cameraSection">
            <div class="selfie-box" id="selfieBox" style="display:none">
              <video id="camVideo" autoplay playsinline muted></video>
            </div>
            <div class="selfie-preview" id="selfiePreview" style="display:none">
              <img id="selfieImg" src="" alt="selfie">
              <div style="padding:6px;text-align:center;font-size:11px;color:var(--grn)">✅ Selfie Captured</div>
            </div>
          </div>
          <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap" id="attBtns">
            <button class="btn btn-grn" id="btnCheckIn" onclick="startCheckIn()">📷 Check In</button>
            <button class="btn btn-red" id="btnCheckOut" style="display:none" onclick="startCheckOut()">📷 Check Out</button>
          </div>
          <div class="att-row" style="margin-top:16px">
            <div class="att-info"><div class="att-iv" id="aIn">--:--</div><div class="att-il">Check In</div></div>
            <div class="att-info"><div class="att-iv" id="aOut">--:--</div><div class="att-il">Check Out</div></div>
            <div class="att-info"><div class="att-iv" id="aHrs">0h 0m</div><div class="att-il">Hours</div></div>
            <div class="att-info"><div class="att-iv" id="aDays">0</div><div class="att-il">Days/Month</div></div>
          </div>
        </div>
        <div id="adminAttView" style="display:none;margin-bottom:14px">
          <div class="fbar">
            <select class="finp btn-ghost" id="attUserFilter" style="width:180px;padding:9px 12px;font-size:12px" onchange="loadAttHistory()">
              <option value="">All Representatives</option>
            </select>
            <input type="month" id="attMonth" class="finp btn-ghost" style="width:150px;padding:9px 12px;font-size:12px" onchange="loadAttHistory()">
          </div>
        </div>
        <div class="card">
          <div class="card-hdr"><div class="card-ttl">📋 Attendance History</div>
            <input type="month" id="attMonthRep" class="finp btn-ghost" style="width:140px;padding:7px 11px;font-size:12px" onchange="loadAttHistory()">
          </div>
          <div class="twrap">
            <table>
              <thead><tr><th>Date</th><th>Rep</th><th>Check In</th><th>In Photo</th><th>Check Out</th><th>Out Photo</th><th>Hours</th><th>Status</th><th style="min-width:40px"></th></thead>
              <tbody id="attTbody"></tbody>
            </table>
          </div>
        </div>
      </div>
