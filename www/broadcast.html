<div class="moverlay" id="mBroadcast">
  <div class="modal" style="max-width:480px">
    <div class="mhdr"><div class="mttl">📢 Send Broadcast</div><button class="mcls" onclick="closeM('mBroadcast')">✕</button></div>
    <div class="mbody">
      <!-- Dynamic info banner — updated by openBroadcastModal() -->
      <div id="broadcastInfoBanner" style="background:rgba(249,115,22,.07);border:1px solid rgba(249,115,22,.2);border-radius:var(--r2);padding:10px 13px;margin-bottom:14px;font-size:12px;color:var(--tx2)">
        📢 This message will appear as a scrolling ticker at the top of the app for all users.
      </div>
      <!-- Zone targeting — revealed for owner only by openBroadcastModal() -->
      <div id="broadcastZoneRow" class="fgrp" style="display:none;margin-bottom:14px">
        <label class="flbl">🗂️ Send To</label>
        <select id="broadcastTargetZone" class="finp" onchange="onBroadcastZoneChange()">
          <option value="all">📡 All Zones</option>
        </select>
        <div style="font-size:10px;color:var(--ylw);margin-top:4px">⚡ Pushed immediately to the selected zone(s) in real-time</div>
      </div>
      <div class="fgrp"><label class="flbl">Broadcast Message *</label>
        <textarea id="broadcastMsg" class="finp" placeholder="Type your message here..." style="min-height:80px"></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="fgrp" style="margin:0"><label class="flbl">Priority</label>
          <select id="broadcastPriority" class="finp">
            <option value="normal">Normal</option>
            <option value="urgent">🚨 Urgent</option>
            <option value="info">ℹ️ Info</option>
          </select></div>
        <div class="fgrp" style="margin:0"><label class="flbl">Expires After</label>
          <select id="broadcastExpiry" class="finp">
            <option value="1">1 Hour</option>
            <option value="6">6 Hours</option>
            <option value="24" selected>24 Hours</option>
            <option value="72">3 Days</option>
            <option value="0">Never</option>
          </select></div>
      </div>
      <div style="margin-top:12px">
        <div style="font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:8px">Active Broadcasts:</div>
        <div id="activeBroadcastsList" style="max-height:160px;overflow-y:auto"></div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost btn-sm" onclick="closeM('mBroadcast')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveBroadcast()">📢 Send Broadcast</button>
    </div>
  </div>
</div>
