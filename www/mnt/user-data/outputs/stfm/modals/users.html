<div class="moverlay" id="mUser">
  <div class="modal">
    <div class="mhdr"><div class="mttl" id="mUserTitle">👤 Add User</div><button class="mcls" onclick="closeM('mUser')">✕</button></div>
    <div class="mbody">
      <div class="fgrp"><label class="flbl">Full Name *</label><input id="uName" class="finp" placeholder="Full name"></div>
      <div class="fgrp"><label class="flbl">Email *</label><input type="email" id="uEmail" class="finp" placeholder="email@company.com"></div>
      <div class="fgrp"><label class="flbl">Password *</label><input type="password" id="uPwd" class="finp" placeholder="min 6 characters"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="fgrp" style="margin:0"><label class="flbl">Role *</label>
          <select id="uRole" class="finp">
            <option value="sales_rep">Sales Representative</option>
            <option value="delivery_man">Delivery Man</option>
            <option value="sub_admin">Sub Admin</option>
            <option value="admin">Admin</option>
          </select></div>
        <div class="fgrp" style="margin:0"><label class="flbl">Phone</label><input id="uPhone" class="finp" placeholder="01XXXXXXXXX"></div>
      </div>
      <input type="hidden" id="uEditId">
      <div class="fgrp" id="uZoneRow" style="margin-top:12px">
        <label class="flbl">🗂️ Assign Zone</label>
        <select id="uZone" class="finp"><option value="">No Zone</option></select>
        <div style="font-size:10px;color:var(--tx3);margin-top:4px">User will only see data in this zone</div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost btn-sm" onclick="closeM('mUser')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveUser()">Create User</button>
    </div>
  </div>
</div>

<div class="moverlay" id="mAdminResetPwd">
  <div class="modal" style="max-width:420px">
    <div class="mhdr"><div class="mttl">🔐 Reset User Password</div><button class="mcls" onclick="closeM('mAdminResetPwd')">✕</button></div>
    <div class="mbody">
      <div style="background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:var(--r2);padding:10px 13px;margin-bottom:14px;font-size:12px;color:var(--tx2)">
        ⚠️ This will send a password reset email to the user. They must click the link to set their new password.
      </div>
      <div style="background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px 14px;margin-bottom:14px">
        <div style="font-weight:700;font-size:13px" id="arpUserName">—</div>
        <div style="font-size:12px;color:var(--tx2);margin-top:2px" id="arpUserEmail">—</div>
      </div>
      <input type="hidden" id="arpUserEmailHidden">
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost btn-sm" onclick="closeM('mAdminResetPwd')">Cancel</button>
      <button class="btn btn-ylw btn-sm" onclick="doAdminResetPassword()">📧 Send Reset Email</button>
    </div>
  </div>
</div>
