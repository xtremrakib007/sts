// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // @capgo/capacitor-updater asks for WorkManager 2.10.x, which requires
    // compileSdk 35 (AGP 8.2.1 / Capacitor 6 builds against 34). The
    // plugin only uses long-standing WorkManager APIs, so pin 2.9.1, the
    // last release that builds against API 34.
    configurations.all {
        resolutionStrategy.force 'androidx.work:work-runtime:2.9.1'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
