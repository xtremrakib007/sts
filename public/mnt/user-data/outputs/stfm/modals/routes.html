<div class="moverlay" id="mRoute">
  <div class="modal">
    <div class="mhdr"><div class="mttl" id="mRouteTitle">🗺️ Add Route</div><button class="mcls" onclick="closeM('mRoute')">✕</button></div>
    <div class="mbody">
      <div class="fgrp"><label class="flbl">Route Name *</label><input id="rName" class="finp" placeholder="e.g. Route A, North Route"></div>
      <div class="fgrp"><label class="flbl">Description</label><textarea id="rDesc" class="finp" placeholder="Route coverage area, notes..." style="min-height:60px"></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" id="rRepRow">
        <div class="fgrp" style="margin:0"><label class="flbl">Assigned Rep</label>
          <select id="rRep" class="finp"><option value="">Unassigned</option></select></div>
        <div class="fgrp" style="margin:0"><label class="flbl">Delivery Man</label>
          <select id="rDelivMan" class="finp"><option value="">Unassigned</option></select></div>
      </div>
      <input type="hidden" id="rEditId">
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost btn-sm" onclick="closeM('mRoute')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveRoute()">Save Route</button>
    </div>
  </div>
</div>

<div class="moverlay" id="mRouteDetail">
  <div class="modal modal-lg">
    <div class="mhdr">
      <div>
        <div class="mttl" id="mRDTitle">🗺️ Route</div>
        <div style="font-size:11px;color:var(--tx3);margin-top:2px" id="mRDSub"></div>
      </div>
      <div style="display:flex;gap:7px;align-items:center">
        <button class="btn btn-ghost btn-xs admin-only" style="display:none" id="mRDEditBtn" onclick="">✏️ Edit</button>
        <button class="mcls" onclick="closeM('mRouteDetail')">✕</button>
      </div>
    </div>
    <div class="mbody" id="mRDBody"></div>
    <div class="mfoot"><button class="btn btn-ghost btn-sm" onclick="closeM('mRouteDetail')">Close</button></div>
  </div>
</div>
