<div class="moverlay" id="mRepLocations">
  <div class="modal modal-lg">
    <div class="mhdr"><div class="mttl">📍 Sales Rep Locations</div><button class="mcls" onclick="closeM('mRepLocations')">✕</button></div>
    <div class="mbody" id="repLocationsBody">
      <div style="font-size:13px;color:var(--tx2);margin-bottom:14px">Live location of all sales representatives (updated automatically)</div>
      <div id="repLocationsList"></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost btn-sm" onclick="closeM('mRepLocations')">Close</button>
      <button class="btn btn-primary btn-sm" onclick="refreshRepLocations()">🔄 Refresh</button>
    </div>
  </div>
</div>

<div class="moverlay" id="mQRScan">
  <div class="modal" style="max-width:360px">
    <div class="mhdr"><div class="mttl">📷 Scan Outlet QR</div><button class="mcls" onclick="closeQRScanner()">✕</button></div>
    <div class="mbody" style="text-align:center;padding:16px">
      <div style="font-size:12px;color:var(--tx2);margin-bottom:12px">Point the camera at an outlet QR code to auto-open the order form</div>
      <div style="position:relative;border-radius:var(--r);overflow:hidden;border:2px solid var(--bdr);background:#000;aspect-ratio:1/1;max-width:300px;margin:0 auto 12px">
        <video id="qrVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:block"></video>
        <canvas id="qrCanvas" style="display:none"></canvas>
        <div style="position:absolute;inset:20px;border:3px solid var(--acc);border-radius:8px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.35)"></div>
      </div>
      <div id="qrScanStatus" style="font-size:12px;color:var(--tx3)">Starting camera…</div>
      <div style="margin-top:12px;font-size:11px;color:var(--tx3)">Or enter QR/outlet code manually:</div>
      <div style="display:flex;gap:7px;margin-top:6px">
        <input id="qrManualCode" class="finp" placeholder="Outlet ID or URL" style="flex:1">
        <button class="btn btn-primary btn-sm" onclick="handleQRManual()">Go</button>
      </div>
    </div>
    <div class="mfoot"><button class="btn btn-ghost btn-sm" onclick="closeQRScanner()">Cancel</button></div>
  </div>
</div>
