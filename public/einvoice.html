<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request e-Invoice</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f4f6f5;--card:#fff;--tx:#14201b;--tx2:#4b5a54;--tx3:#7d8a85;--bdr:#dfe5e2;--acc:#15935f;--err:#c62828}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1513;--card:#17201c;--tx:#e9f0ed;--tx2:#b3c0bb;--tx3:#83918b;--bdr:#2a3631;--acc:#2cc483;--err:#ef6b6b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  .card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:20px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--tx2);font-size:13px;margin:0 0 16px}
  .inv{display:inline-block;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px}
  label{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin:14px 0 5px}
  input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:11px 12px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--acc)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .seg button{font:inherit;font-weight:700;padding:11px;border-radius:10px;border:1px solid var(--bdr);background:var(--card);color:var(--tx2);cursor:pointer}
  .seg button.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .hint{font-size:11px;color:var(--tx3);margin-top:4px}
  .btn{display:block;width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:800;cursor:pointer}
  .btn:disabled{opacity:.6}
  .msg{margin-top:14px;font-size:13px}
  .msg.err{color:var(--err)}
  .done{text-align:center;padding:10px 0}
  .done div:first-child{font-size:44px}
  .foot{text-align:center;color:var(--tx3);font-size:11px;margin-top:16px}
  @media (max-width:420px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <h1>Request an LHDN e-Invoice</h1>
    <p class="sub">Sairah Trading Sdn Bhd will issue a validated e-Invoice through MyInvois for invoice <span class="inv" id="invNo">—</span></p>
    <form id="f" novalidate>
      <label>I am buying as</label>
      <div class="seg" role="radiogroup">
        <button type="button" class="on" data-type="company" aria-pressed="true">🏢 Company / business</button>
        <button type="button" data-type="individual" aria-pressed="false">👤 Individual</button>
      </div>

      <label for="buyerName" id="nameLbl">Registered company name *</label>
      <input id="buyerName" maxlength="200" autocomplete="organization" required>

      <label for="tin">Tax Identification Number (TIN) *</label>
      <input id="tin" maxlength="20" autocapitalize="characters" placeholder="e.g. C12345678090 or IG12345678090" required>
      <div class="hint">Find it on MyTax (mytax.hasil.gov.my) or your LHDN letter.</div>

      <div class="row">
        <div>
          <label for="idType">ID type *</label>
          <select id="idType">
            <option value="BRN">Business reg. no. (BRN)</option>
            <option value="NRIC">MyKad / MyTentera (NRIC)</option>
            <option value="PASSPORT">Passport</option>
            <option value="ARMY">Army ID</option>
          </select>
        </div>
        <div>
          <label for="idNo">ID number *</label>
          <input id="idNo" maxlength="30" required>
        </div>
      </div>

      <label for="sstNo">SST registration no. (if any)</label>
      <input id="sstNo" maxlength="40">

      <div class="row">
        <div>
          <label for="email">Email for the e-Invoice *</label>
          <input id="email" type="email" maxlength="120" autocomplete="email" required>
        </div>
        <div>
          <label for="phone">Phone *</label>
          <input id="phone" type="tel" maxlength="20" autocomplete="tel" required>
        </div>
      </div>

      <label for="addressLine">Address *</label>
      <input id="addressLine" maxlength="200" autocomplete="street-address" required>
      <div class="row">
        <div><label for="postcode">Postcode *</label><input id="postcode" inputmode="numeric" maxlength="10" required></div>
        <div><label for="city">City *</label><input id="city" maxlength="60" required></div>
      </div>
      <label for="state">State *</label>
      <select id="state">
        <option>Johor</option><option>Kedah</option><option>Kelantan</option><option>Melaka</option><option>Negeri Sembilan</option>
        <option>Pahang</option><option>Perak</option><option>Perlis</option><option>Pulau Pinang</option><option>Sabah</option>
        <option>Sarawak</option><option selected>Selangor</option><option>Terengganu</option><option>W.P. Kuala Lumpur</option>
        <option>W.P. Labuan</option><option>W.P. Putrajaya</option>
      </select>

      <label for="notes">Notes (optional)</label>
      <textarea id="notes" rows="2" maxlength="300"></textarea>

      <button class="btn" id="go" type="submit">Submit request</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </div>
  <div class="foot">Your details are used only to issue this e-Invoice.</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyC0cO3x4Oqi8GBUhzON-InN3YZTm-RfMyA",
  authDomain: "stfm-sales.firebaseapp.com",
  projectId: "stfm-sales",
  storageBucket: "stfm-sales.firebasestorage.app",
  messagingSenderId: "53800678989",
  appId: "1:53800678989:web:bce1be11a8beb92c084e04"
}));

const p = new URLSearchParams(location.search);
const invoiceNo = (p.get('i') || '').trim();
const token = (p.get('t') || '').trim();
const $ = id => document.getElementById(id);
const msg = (t, err) => { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); };
$('invNo').textContent = invoiceNo || '—';
if (!/^[A-Za-z0-9_-]{1,40}$/.test(invoiceNo) || !/^[a-f0-9]{32}$/.test(token)) {
  $('f').innerHTML = '<p class="msg err">This link is incomplete. Please scan the QR code on your invoice again.</p>';
}

let buyerType = 'company';
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  buyerType = b.dataset.type;
  document.querySelectorAll('.seg button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
  $('nameLbl').textContent = buyerType === 'company' ? 'Registered company name *' : 'Full name (as in MyKad / passport) *';
  $('idType').value = buyerType === 'company' ? 'BRN' : 'NRIC';
});

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const v = id => $(id).value.trim();
  const data = {
    invoiceNo, token, buyerType,
    buyerName: v('buyerName'), tin: v('tin').toUpperCase().replace(/\s+/g, ''),
    idType: $('idType').value, idNo: v('idNo').replace(/\s+/g, ''), sstNo: v('sstNo'),
    email: v('email'), phone: v('phone'),
    addressLine: v('addressLine'), postcode: v('postcode'), city: v('city'), state: $('state').value, country: 'MYS',
    notes: v('notes'), status: 'pending', createdAt: serverTimestamp(),
  };
  if (!data.buyerName || !data.idNo || !data.addressLine || !data.postcode || !data.city || !data.phone) return msg('Please fill in every field marked *', true);
  if (!/^[A-Z]{1,2}\d{8,13}$/.test(data.tin)) return msg('Check the TIN — it starts with letters (e.g. C or IG) followed by numbers.', true);
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)) return msg('Enter a valid email address.', true);
  $('go').disabled = true; msg('Sending…');
  try {
    await setDoc(doc(db, 'stsb_einvoice_requests', invoiceNo), data);
    $('card').innerHTML = `<div class="done"><div>✅</div><h1>Request received</h1>
      <p class="sub">We will email the validated e-Invoice for <strong>${invoiceNo.replace(/[<>&]/g, '')}</strong> to <strong>${data.email.replace(/[<>&]/g, '')}</strong>.</p></div>`;
  } catch (err) {
    $('go').disabled = false;
    msg(err && err.code === 'permission-denied'
      ? 'We could not accept this request. It may already have been submitted or processed, or the link is not valid. Please contact us with your invoice number.'
      : 'Could not send — check your connection and try again.', true);
  }
});
</script>
</body>
</html>
