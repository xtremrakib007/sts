name: STFM Pull Request Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stfm-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Verify generated files
        run: |
          test -s public/index.html
          test -s public/js/app.min.js
          test -s www/index.html
          test -s www/js/app.min.js
