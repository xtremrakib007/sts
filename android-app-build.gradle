// android/app/build.gradle
// Place this at: android/app/build.gradle
// Run: npx cap sync android  — after saving this file

apply plugin: 'com.android.application'

android {
    namespace "com.sairahtrading.stfm"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.sairahtrading.stfm"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Uncomment and configure when you have a keystore:
            // signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Capacitor core
    implementation project(':capacitor-android')

    // AndroidX — required by FileProvider (fixes camera capture on Android 7+)
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Required by Capacitor Camera plugin
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Required by Capacitor Push Notifications (FCM)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

// Apply Google Services plugin (required for FCM)
apply plugin: 'com.google.gms.google-services'
